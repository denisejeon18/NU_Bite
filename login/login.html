<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NU Bite Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<main class="login-page">
  <section class="login-card">
    <div class="brand-center">
      <div class="brand-logo">NU</div>
      <h1>NU Bite</h1>
    </div>

    <h2>Smart Canteen Pre-Ordering System</h2>
    <p>Login using your username and password.</p>

    <input type="text" id="username" placeholder="Username">

    <div class="password-wrap">
      <input type="password" id="password" placeholder="Password">
      <button type="button" id="togglePasswordBtn" onclick="togglePassword()">👁️</button>
    </div>

    <button onclick="loginUser()">Login</button>

    <button class="guest-btn" onclick="continueAsGuest()">
      Continue as Guest
    </button>
  </section>
</main>

<div class="logout-modal" id="loginErrorModal">
  <div class="logout-box">
    <div class="logout-icon">⚠️</div>
    <h2>Login Failed</h2>
    <p>Invalid username or password. Please try again.</p>

    <div class="logout-actions">
      <button class="confirm-btn" onclick="closeLoginErrorModal()">Try Again</button>
    </div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
